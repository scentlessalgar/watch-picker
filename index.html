<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What2Watch</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>🍿 What2Watch</h1>
    <p class="subtitle">Tell it what you're in the mood for, it picks something.</p>
  </header>

  <main>
    <section class="filters">

      <div class="field">
        <label>Movie or TV show?</label>
        <div class="toggle-group" id="typeToggle">
          <button type="button" class="toggle-btn active" data-value="any">Either</button>
          <button type="button" class="toggle-btn" data-value="movie">Movie</button>
          <button type="button" class="toggle-btn" data-value="tv">TV show</button>
        </div>
      </div>

      <div class="field">
        <label for="genre">Genre</label>
        <select id="genre">
          <option value="any">Any</option>
        </select>
      </div>

      <div class="field">
        <label for="maxRuntime">Max length: <span id="maxRuntimeValue">Longer</span></label>
        <input type="range" id="maxRuntime" min="0" max="6" step="1" value="6" list="runtimeTicks">
        <datalist id="runtimeTicks">
          <option value="0"></option><option value="1"></option><option value="2"></option>
          <option value="3"></option><option value="4"></option><option value="5"></option>
          <option value="6"></option>
        </datalist>
      </div>

      <div class="field">
        <label for="minRating">Average Rating: <span id="minRatingValue">Any</span></label>
        <input type="range" id="minRating" min="0" max="100" step="5" value="0" list="ratingTicks">
        <datalist id="ratingTicks">
          <option value="0"></option><option value="20"></option><option value="40"></option>
          <option value="60"></option><option value="80"></option><option value="100"></option>
        </datalist>
      </div>

      <div class="field services">
        <label>Which services do you have?</label>
        <div id="serviceList" class="service-grid"></div>
      </div>

    </section>

    <button id="pickBtn">Suggest some options 🎲</button>

    <section id="result" class="result hidden"></section>
    <p id="emptyMessage" class="empty hidden">Nothing matches those filters — try widening one of them.</p>
  </main>

  <footer>
    <p>This product uses the TMDB API but is not endorsed or certified by
      <a href="https://www.themoviedb.org/" target="_blank" rel="noopener">TMDB</a>.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
