<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What2Watch</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>🍿 What2Watch</h1>
    <p class="subtitle">Tell it what you're in the mood for, it picks something.</p>
    <div class="auth-bar">
      <span id="authStatus">Checking sign-in status…</span>
      <button type="button" id="signInBtn" class="auth-link hidden">Sign in</button>
      <button type="button" id="signOutBtn" class="auth-link hidden">Sign out</button>
    </div>
  </header>

  <main>
    <section class="filters">

      <div class="field">
        <label>Movie or TV show?</label>
        <div class="toggle-group" id="typeToggle">
          <button type="button" class="toggle-btn active" data-value="any">Either</button>
          <button type="button" class="toggle-btn" data-value="movie">Movie</button>
          <button type="button" class="toggle-btn" data-value="tv">TV show</button>
        </div>
      </div>

      <div class="field">
        <label>Genre</label>
        <button type="button" id="genreBtn" class="picker-btn">Any</button>
      </div>

      <div class="field">
        <label for="maxRuntime">Max length: <span id="maxRuntimeValue">Longer</span></label>
        <input type="range" id="maxRuntime" min="0" max="6" step="1" value="6" list="runtimeTicks">
        <datalist id="runtimeTicks">
          <option value="0"></option><option value="1"></option><option value="2"></option>
          <option value="3"></option><option value="4"></option><option value="5"></option>
          <option value="6"></option>
        </datalist>
      </div>

      <div class="field">
        <label for="minRating">Average Rating: <span id="minRatingValue">Any</span></label>
        <input type="range" id="minRating" min="0" max="100" step="5" value="0" list="ratingTicks">
        <datalist id="ratingTicks">
          <option value="0"></option><option value="20"></option><option value="40"></option>
          <option value="60"></option><option value="80"></option><option value="100"></option>
        </datalist>
      </div>

      <div class="field">
        <label>Max age rating</label>
        <div class="rating-group" id="ageRatingGroup">
          <button type="button" class="rating-btn" data-value="U" aria-pressed="true" aria-label="U">
            <svg class="rating-icon" viewBox="0 0 44 44" aria-hidden="true">
              <circle cx="22" cy="22" r="20" fill="#2bbf46" stroke="#0b0b0b" stroke-width="2"/>
              <text x="22" y="29" text-anchor="middle" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="19" fill="#fff">U</text>
            </svg>
          </button>
          <button type="button" class="rating-btn" data-value="PG" aria-pressed="true" aria-label="PG">
            <svg class="rating-icon" viewBox="0 0 44 44" aria-hidden="true">
              <circle cx="22" cy="22" r="20" fill="#ffb100" stroke="#0b0b0b" stroke-width="2"/>
              <text x="22" y="28" text-anchor="middle" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="14" letter-spacing="-0.3" fill="#fff">PG</text>
            </svg>
          </button>
          <button type="button" class="rating-btn" data-value="12" aria-pressed="true" aria-label="12">
            <svg class="rating-icon" viewBox="0 0 44 44" aria-hidden="true">
              <circle cx="22" cy="22" r="20" fill="#f4761f" stroke="#0b0b0b" stroke-width="2"/>
              <text x="22" y="28" text-anchor="middle" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="16" letter-spacing="-0.3" fill="#fff">12</text>
            </svg>
          </button>
          <button type="button" class="rating-btn" data-value="15" aria-pressed="true" aria-label="15">
            <svg class="rating-icon" viewBox="0 0 44 44" aria-hidden="true">
              <circle cx="22" cy="22" r="20" fill="#ec1c7d" stroke="#0b0b0b" stroke-width="2"/>
              <text x="22" y="28" text-anchor="middle" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="16" letter-spacing="-0.3" fill="#fff">15</text>
            </svg>
          </button>
          <button type="button" class="rating-btn" data-value="18" aria-pressed="true" aria-label="18">
            <svg class="rating-icon" viewBox="0 0 44 44" aria-hidden="true">
              <circle cx="22" cy="22" r="20" fill="#d0161f" stroke="#0b0b0b" stroke-width="2"/>
              <text x="22" y="28" text-anchor="middle" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="16" letter-spacing="-0.3" fill="#fff">18</text>
            </svg>
          </button>
        </div>
      </div>

      <div class="field services">
        <label>Which services do you have?</label>
        <div id="serviceList" class="service-grid"></div>
      </div>

    </section>

    <button type="button" id="pickBtn">Show me What2Watch</button>

    <section id="result" class="result hidden"></section>
    <p id="emptyMessage" class="empty hidden">Nothing matches those filters — try widening one of them.</p>
  </main>

  <dialog id="genreDialog">
    <div class="dialog-header">
      <h3>Choose genres</h3>
      <button type="button" id="genreClose" class="dialog-close" aria-label="Close">✕</button>
    </div>
    <div id="genreGrid" class="chip-grid"></div>
    <div class="dialog-footer">
      <button type="button" id="genreCancel" class="dialog-btn secondary">Cancel</button>
      <button type="button" id="genreOk" class="dialog-btn primary">OK</button>
    </div>
  </dialog>

  <dialog id="authDialog">
    <div class="dialog-header">
      <h3>Sign in</h3>
      <button type="button" id="authClose" class="dialog-close" aria-label="Close">✕</button>
    </div>
    <div class="auth-form">
      <button type="button" id="googleSignInBtn" class="dialog-btn google-btn">Continue with Google</button>
      <div class="auth-divider">or</div>
      <input type="email" id="authEmail" class="text-input" placeholder="Email" autocomplete="email">
      <input type="password" id="authPassword" class="text-input" placeholder="Password" autocomplete="current-password">
      <p id="authError" class="auth-error hidden"></p>
      <div class="auth-form-buttons">
        <button type="button" id="authSignInBtn" class="dialog-btn secondary">Sign in</button>
        <button type="button" id="authCreateBtn" class="dialog-btn primary">Create account</button>
      </div>
    </div>
  </dialog>

  <footer>
    <p>This product uses the TMDB API but is not endorsed or certified by
      <a href="https://www.themoviedb.org/" target="_blank" rel="noopener">TMDB</a>.</p>
  </footer>

  <!-- Firebase (plain <script> version — no build step, matches the rest of this app) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <script src="script.js"></script>
</body>
</html>
